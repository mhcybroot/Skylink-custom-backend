<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Leave Quotas</title>
</head>
<body>
    <div th:replace="~{layout :: layout(~{::section}, ~{::script}, 'leave-quotas')}">
        <section class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="fw-bold mb-1"><i class="fas fa-umbrella-beach text-warning me-2"></i> Employee Leave Quotas</h3>
                        <p class="text-muted mb-0">Overview of annual leave usage across all employees</p>
                    </div>
                    <a href="/dashboard" class="btn btn-outline-secondary rounded-pill shadow-sm"><i class="fas fa-arrow-left me-1"></i> Back to Dashboard</a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="border-0 rounded-start">Employee</th>
                                        <th scope="col" class="border-0 text-center"><i class="fas fa-notes-medical text-danger me-1"></i> Sick Quota</th>
                                        <th scope="col" class="border-0 text-center"><i class="fas fa-umbrella-beach text-warning me-1"></i> Casual & Others Quota</th>
                                        <th scope="col" class="border-0 text-center">Total & Absences</th>
                                        <th scope="col" class="border-0 text-center rounded-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="emp : ${employeeQuotas}">
                                        <td>
                                            <div class="fw-bold text-dark" th:text="${emp.employeeName}">Employee Name</div>
                                            <small class="text-muted" th:text="${emp.employeeId}"></small>
                                        </td>
                                        <!-- Sick Quota -->
                                        <td class="text-center" style="min-width: 200px;">
                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                <small class="text-muted"><span th:text="${emp.sickLeavesTaken}">0</span> / <span th:text="${emp.sickQuota}">6</span> Days</small>
                                                <small class="fw-bold" th:classappend="${emp.sickUsagePercentage >= 100} ? 'text-danger' : 'text-secondary'" th:text="${#numbers.formatDecimal(emp.sickUsagePercentage, 1, 1)} + '%'"></small>
                                            </div>
                                            <div class="progress mb-2" style="height: 6px;">
                                                <div class="progress-bar bg-danger" role="progressbar"
                                                    th:style="'width: ' + ${emp.sickUsagePercentage > 100 ? 100 : emp.sickUsagePercentage} + '%'"></div>
                                            </div>
                                            <div class="d-flex justify-content-center gap-1 flex-wrap">
                                                <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill" style="font-size: 0.7rem;" th:text="'Paid: ' + ${emp.sickPaidTaken}"></span>
                                                <span th:if="${emp.sickUnpaidTaken > 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill" style="font-size: 0.7rem;" th:text="'Unpaid: ' + ${emp.sickUnpaidTaken}"></span>
                                                <span class="badge bg-light text-muted border rounded-pill" style="font-size: 0.7rem;" th:text="'Left: ' + ${emp.sickRemaining}"></span>
                                            </div>
                                        </td>
                                        <!-- Casual & Others Quota -->
                                        <td class="text-center" style="min-width: 200px;">
                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                <small class="text-muted"><span th:text="${emp.casualLeavesTaken + emp.otherLeavesTaken}">0</span> / <span th:text="${emp.casualQuota}">6</span> Days</small>
                                                <small class="fw-bold" th:classappend="${emp.casualUsagePercentage >= 100} ? 'text-danger' : 'text-secondary'" th:text="${#numbers.formatDecimal(emp.casualUsagePercentage, 1, 1)} + '%'"></small>
                                            </div>
                                            <div class="progress mb-2" style="height: 6px;">
                                                <div class="progress-bar bg-warning" role="progressbar"
                                                    th:style="'width: ' + ${emp.casualUsagePercentage > 100 ? 100 : emp.casualUsagePercentage} + '%'"></div>
                                            </div>
                                            <div class="d-flex justify-content-center gap-1 flex-wrap">
                                                <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill" style="font-size: 0.7rem;" th:text="'Paid: ' + ${emp.casualPaidTaken}"></span>
                                                <span th:if="${emp.casualUnpaidTaken > 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill" style="font-size: 0.7rem;" th:text="'Unpaid: ' + ${emp.casualUnpaidTaken}"></span>
                                                <span class="badge bg-light text-muted border rounded-pill" style="font-size: 0.7rem;" th:text="'Left: ' + ${emp.casualRemaining}"></span>
                                            </div>
                                        </td>
                                        <!-- Total & Absent Summary -->
                                        <td class="text-center" style="min-width: 170px;">
                                            <div class="small fw-semibold text-dark mb-1">
                                                Total: <span th:text="${emp.yearlyLeavesTaken}"></span> / <span th:text="${emp.annualQuota}"></span> Days
                                            </div>
                                            <div class="d-flex justify-content-center gap-1 flex-wrap">
                                                <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill" title="Absent Days" th:text="'Absent: ' + ${emp.absentDays}"></span>
                                                <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill" th:text="'Casual: ' + ${emp.casualLeavesTaken}"></span>
                                                <span th:if="${emp.otherLeavesTaken > 0}" class="badge bg-light text-dark border rounded-pill" th:text="'Other: ' + ${emp.otherLeavesTaken}"></span>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{/leave-quotas/employee/{id}(id=${emp.employeeId})}" class="btn btn-sm btn-outline-primary rounded-pill">
                                                View Details
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(employeeQuotas)}">
                                        <td colspan="5" class="text-center text-muted py-4">No employees found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </section>
        <script>
            // Any specific scripts for this page
        </script>
    </div>
</body>
</html>
